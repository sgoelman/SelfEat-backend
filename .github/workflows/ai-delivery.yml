name: AI delivery review and repair
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ai-delivery-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: >-
      vars.AI_DELIVERY_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # Control code comes from the trusted base, never from the proposed change.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned agent CLIs
        run: npm install --global @openai/codex@0.163.0 @anthropic-ai/claude-code@2.1.306
      - name: Test controller boundaries
        run: python3 -m unittest discover -s control/.github/ai-delivery -p 'test_*.py'
      - name: Review and prepare bounded repair patch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_MODEL: ${{ vars.AI_DELIVERY_CODEX_MODEL }}
          CLAUDE_MODEL: ${{ vars.AI_DELIVERY_CLAUDE_MODEL }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 control/.github/ai-delivery/run.py candidate "$BASE_SHA" ai-delivery-results
      - name: Preserve review evidence and repair patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-delivery-${{ github.event.pull_request.head.sha }}
          path: ai-delivery-results/
          if-no-files-found: warn
          retention-days: 14
